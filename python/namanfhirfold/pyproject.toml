[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "namanfhirfold"
version = "0.1.0"
description = "FHIR clinical-context and token optimization SDK for CDS Hooks and LLMs."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Jain-Naman-V", email = "namanvjain456@gmail.com" }
]
keywords = ["fhir", "llm", "tokens", "compression", "healthcare", "cds-hooks", "medprompt", "fhirbench"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Jain-Naman-V/namanfhirfold"
Repository = "https://github.com/Jain-Naman-V/namanfhirfold"
