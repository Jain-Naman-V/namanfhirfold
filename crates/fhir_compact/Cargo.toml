[package]
name = "fhir_compact"
version = "0.1.0"
edition = "2021"
authors = ["ClinContext Team <team@clincontext.io>"]
description = "High-performance zero-copy task-aware FHIR R4 token compression engine for CDS Hooks and LLMs"
license = "MIT"
readme = "README.md"
keywords = ["fhir", "llm", "tokens", "healthcare", "cds-hooks"]
categories = ["text-processing", "parsing", "web-programming"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"], default-features = false }
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
wasm = ["wasm-bindgen"]

[lib]
crate-type = ["cdylib", "rlib"]
